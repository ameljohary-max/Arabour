<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" width="100%" height="40">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a98226" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#a98226" />
    </linearGradient>
  </defs>

  <!-- Center Star Group — rotates slowly -->
  <g transform="translate(200, 20)">
    <rect x="-7" y="-7" width="14" height="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate"
        from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </rect>
    <rect x="-7" y="-7" width="14" height="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate"
        from="45" to="405" dur="12s" repeatCount="indefinite"/>
    </rect>
    <circle cx="0" cy="0" r="2.5" fill="url(#goldGrad)">
      <animate attributeName="r" values="2.5;3.2;2.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Calligraphic left line -->
  <path d="M 180,20 C 160,20 145,14 135,14 C 120,14 110,26 95,26 C 85,26 75,17 60,20 C 45,23 30,20 15,20"
    fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Calligraphic right line -->
  <path d="M 220,20 C 240,20 255,14 265,14 C 280,14 290,26 305,26 C 315,26 325,17 340,20 C 355,23 370,20 385,20"
    fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- Diamonds — gentle pulse -->
  <polygon points="135,10 137,12 135,14 133,12" fill="url(#goldGrad)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="95,30 97,32 95,34 93,32" fill="url(#goldGrad)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="265,10 267,12 265,14 263,12" fill="url(#goldGrad)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="305,30 307,32 305,34 303,32" fill="url(#goldGrad)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
  </polygon>
</svg>
